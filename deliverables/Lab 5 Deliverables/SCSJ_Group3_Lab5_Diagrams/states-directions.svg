<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="40" width="600" height="470" rx="12" fill="#FFF8E1" stroke="#C9A227" stroke-width="1.3"/><line x1="20" y1="66" x2="620" y2="66" stroke="#C9A227" stroke-width="1"/><text x="320.0" y="58" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1A1A1A">Directions</text><circle cx="200" cy="88" r="8" fill="#111111"/><polygon points="200,128 212,140 200,152 188,140" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.3"/><polyline points="200,96 200,128" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="110" y="250" width="180" height="45" rx="10" fill="#FCEFC7" stroke="#C9A227" stroke-width="1.3"/><text x="200.0" y="277.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1A1A1A">FindingRoute</text><rect x="430" y="250" width="160" height="45" rx="10" fill="#FCEFC7" stroke="#C9A227" stroke-width="1.3"/><text x="510.0" y="277.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1A1A1A">RouteError</text><rect x="430" y="165" width="160" height="45" rx="10" fill="#FCEFC7" stroke="#C9A227" stroke-width="1.3"/><text x="510.0" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1A1A1A">LocationNeeded</text><rect x="60" y="400" width="240" height="70" rx="10" fill="#FCEFC7" stroke="#C9A227" stroke-width="1.3"/><text x="180.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1A1A1A">RouteShown</text><line x1="60" y1="426" x2="300" y2="426" stroke="#C9A227" stroke-width="1"/><text x="69" y="443" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#1A1A1A">entry / draw route, list steps</text><text x="69" y="459" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#1A1A1A">with station crowd levels</text><polyline points="200,152 200,250" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><text x="207" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#1A1A1A">[location allowed]</text><polyline points="212,140 510,140 510,165" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><text x="360" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1A1A1A">[location denied]</text><polyline points="290,262 430,262" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><text x="360.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1A1A1A">route failed</text><polyline points="430,285 290,285" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><text x="360.0" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1A1A1A">tap &quot;Try again&quot;</text><polyline points="150,295 150,400" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><text x="157" y="351.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#1A1A1A