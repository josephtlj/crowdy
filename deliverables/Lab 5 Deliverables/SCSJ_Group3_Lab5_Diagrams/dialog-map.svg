normal" fill="#1A1A1A">tap &quot;Later&quot;</text><text x="40" y="762" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#1A1A1A">Each label sits above its line. Every screen except Home also has a back button that returns to the screen it was opened from. Going back to Home returns to the last tab used (H).</text></svg>